name: LAB CI

on:
  push:
    branches: [lab-rebuild-2026]
    paths:
      - 'lab-app/**'
      - 'docs/**'
      - '.agents/**'
      - '.github/workflows/lab-ci.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    paths:
      - 'lab-app/**'
      - 'docs/**'
      - '.agents/**'
      - '.github/workflows/lab-ci.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, architecture, security and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab-app
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (temporary until lockfile is committed)
        run: npm install --no-audit --no-fund
      - name: Parse database backup PowerShell syntax without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $syntaxErrors = $null
          $path = (Resolve-Path "./scripts/backup-labgame.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$syntaxErrors) | Out-Null
          if ($syntaxErrors.Count -gt 0) {
            $syntaxErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate engineering documentation and security baselines
        run: npm run verify:engineering
      - name: Run unit tests
        run: npm test
      - name: Check TypeScript and build Vite
        run: npm run build

  v2-postgres:
    name: V2 isolated PostgreSQL ${{ matrix.postgres }} integration and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    defaults:
      run:
        working-directory: lab-app
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: labgame_v2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: labv2_ci_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d labgame_v2_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Execute V2 shadow schema and tests against temporary PostgreSQL only
        env:
          PGPASSWORD: labv2_ci_local_only
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d labgame_v2_ci -v ON_ERROR_STOP=1 -f scripts/tests/v2-postgres-smoke.sql


  supabase-local-auth:
    name: Free local Supabase Auth + two-account RLS E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lab-app
    steps:
      - name: Checkout test commit (no production secrets)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install LAB client SDK
        run: npm install --no-audit --no-fund
      - name: Boot disposable Supabase locally (Auth, REST, Postgres)
        run: |
          npx --yes supabase@latest start --exclude realtime,storage,functions,studio,analytics,pooler > /tmp/labgame-supabase-start.log 2>&1 || {
            echo "Local Supabase failed to initialize; safe migration/error lines:";
            grep -Ei 'migration|error|failed|fatal' /tmp/labgame-supabase-start.log | tail -30 || true;
            exit 1;
          }
          npx --yes supabase@latest status -o env > /tmp/labgame-supabase-ci.env
      - name: Exercise two real local Auth sessions and RLS
        env:
          LAB_SUPABASE_LOCAL_ENV_FILE: /tmp/labgame-supabase-ci.env
        run: node scripts/tests/local-supabase-auth.mjs
      - name: Tear down ephemeral test stack
        if: always()
        run: npx --yes supabase@latest stop --no-backup || true
