name: Recover transient agent patch failures
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Trusted coding run to inspect
        required: true
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: agent-recovery-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main' && (github.actor == 'MILAGRESMARINGA' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retry only a marked patch protocol failure, at most three attempts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agents/scripts/recover-agent-run.mjs
