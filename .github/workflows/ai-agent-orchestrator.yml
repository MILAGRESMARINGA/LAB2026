name: Controlled LABGame coding agent
run-name: "LAB coding · Issue ${{ inputs.issue_number || 'direct' }}"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Direct task (president only); alternatively provide issue_number"
        required: false
        type: string
      issue_number:
        description: "Trusted LAB Agent issue created by the voice intake"
        required: false
        type: string
      approved_spend_usd:
        description: "President-approved USD task cap, at most 0.25; reserves up to 3 model responses"
        required: true
        default: "0"
        type: string
      approved_spend_brl:
        description: "President-approved maximum model spend for this run; 0 disables inference"
        required: true
        default: "0"
        type: string

permissions: {}

concurrency:
  group: labgame-agent-global-budget
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/lab-rebuild-2026' && (github.actor == 'MILAGRESMARINGA' || (github.actor == 'github-actions[bot]' && github.event.inputs.issue_number != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      patch_ready: ${{ steps.generate.outputs.patch_ready }}
    steps:
      - name: Checkout exact trusted source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate bounded patch artifact
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_TEMP: ${{ runner.temp }}
          AGENT_TASK: ${{ github.event.inputs.task }}
          AGENT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          APPROVED_SPEND_USD: ${{ github.event.inputs.approved_spend_usd }}
          APPROVED_SPEND_BRL: ${{ github.event.inputs.approved_spend_brl }}
        run: |
          node .agents/scripts/run-ai-orchestrator.mjs
      - name: Account consumed model attempt
        if: always() && steps.generate.outputs.model_attempt_consumed == 'true'
        run: echo "Model response or uncertain delivery counted."
      - name: Account retryable patch protocol failure
        if: always() && steps.generate.outputs.retryable_patch_failure == 'true'
        run: echo "Patch format or exact-match failure; eligible for bounded recovery."
      - name: Account rejected or unsent request
        if: always() && steps.generate.outputs.model_attempt_consumed == 'false'
        run: echo "Provider rejected or request was never sent; no model attempt consumed."
      - name: Upload generated patch as data only
        if: steps.generate.outputs.patch_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lab-agent-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/lab-agent-patch/patch.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify:
    needs: generate
    if: needs.generate.outputs.patch_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download patch data
        uses: actions/download-artifact@v4
        with:
          name: lab-agent-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/lab-agent-patch
      - name: Install project dependencies without credentials
        working-directory: lab-app
        run: npm install --no-audit --no-fund
      - name: Apply validated patch and run allowlisted tests without secrets
        id: verify
        env:
          AGENT_PATCH_FILE: ${{ runner.temp }}/lab-agent-patch/patch.json
          GITHUB_SHA: ${{ github.sha }}
        run: node .agents/scripts/verify-agent-patch.mjs
      - name: Account retryable patch QA failure
        if: always() && steps.verify.outcome == 'failure'
        run: echo "Generated patch failed QA; regenerate with prior compiler feedback."
      - name: Upload verified patch metadata
        uses: actions/upload-artifact@v7
        with:
          name: lab-agent-verified-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/lab-agent-patch/verified-patch.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: [generate, verify]
    if: needs.generate.outputs.patch_ready == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout trusted publisher code without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified patch data
        uses: actions/download-artifact@v4
        with:
          name: lab-agent-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/lab-agent-patch
      - name: Download successful verification report
        uses: actions/download-artifact@v4
        with:
          name: lab-agent-verified-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/lab-agent-patch
      - name: Publish isolated branch and Draft PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AGENT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          AGENT_PATCH_FILE: ${{ runner.temp }}/lab-agent-patch/patch.json
          GITHUB_REF: ${{ github.ref }}
        run: node .agents/scripts/publish-agent-pr.mjs

  request-recovery:
    needs: [generate, verify]
    if: always() && (needs.generate.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Queue trusted recovery after failed generation or QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agents/scripts/recover-agent-run.mjs --dispatch

