version: '3.8'
services:
  wpp-backend:
    build:
      context: ./wpp-backend
      dockerfile: Dockerfile
    env_file:
      - .env
    # Passing environment variables explicitly or via root .env is easier for single file
    ports:
      - "3333:3333"
    volumes:
      - ./wpp-backend:/usr/src/app
    depends_on: []
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # env_file:
    #   - .env
    ports:
      - "5173:5173"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/wpp-backend # Exclude backend folder
    environment:
      VITE_API_BASE: http://localhost:3333
      VITE_WPP_SOCKET_URL: http://localhost:3333
    restart: unless-stopped

