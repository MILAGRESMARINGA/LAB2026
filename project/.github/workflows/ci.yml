name: CRMIMOBI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Install Frontend Dependencies
      working-directory: ./project
      run: npm install

    - name: Install Backend Dependencies
      working-directory: ./project/wpp-backend
      run: npm install

    - name: Run Backend Tests
      working-directory: ./project/wpp-backend
      run: npm test
